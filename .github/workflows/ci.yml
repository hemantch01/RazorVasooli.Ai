name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck + build (tsc -b && vite build)
        run: npm run build

      - name: Unit tests (vitest)
        run: npm test

      - name: Docker build
        run: docker build -t razorvasooli:${{ github.sha }} .